# HospiTrack CI/CD Pipeline
# Runs on push and pull requests to main branch

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # Job 1: Lint and Format Check
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          pip install -r requirements_fastapi.txt
      
      - name: Run Black (formatting check)
        run: black . --check --diff
      
      - name: Run isort (import sorting check)
        run: isort . --check-only --diff
      
      - name: Run Flake8 (linting)
        run: flake8 . --config=.flake8 --show-source --statistics
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Prettier
        run: npm install -g prettier
      
      - name: Run Prettier (JS/CSS formatting check)
        run: prettier --check "static/**/*.{js,css,html}" --ignore-path .prettierignore || true

  # Job 2: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_fastapi.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Verify data files exist
        run: |
          if [ ! -f data/us_er.parquet ]; then
            echo "Warning: data/us_er.parquet not found. Tests may fail."
          else
            echo "Data file found."
          fi
      
      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --cov=modules --cov-report=xml --cov-report=term
        env:
          HOSPITRACK_DATA_PATH: ./data
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 3: Build Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image (production)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: false
          tags: hospitracker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/hospitracker-image.tar
      
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/hospitracker-image.tar
          retention-days: 1

  # Job 4: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_fastapi.txt
          pip install safety pip-audit
      
      - name: Run Safety check (dependency vulnerabilities)
        run: safety check --json || true
        continue-on-error: true
      
      - name: Run pip-audit (CVE scanning)
        run: pip-audit --desc --requirement requirements_fastapi.txt || true
        continue-on-error: true

  # Job 5: Deploy to Render (optional - only on main branch)
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      
      - name: Wait for deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Deployment triggered. Check Render dashboard for status."
          echo "URL: https://dashboard.render.com"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      
      - name: Deployment skipped (no deploy hook)
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "Render deploy hook not configured. Skipping deployment."
          echo "To enable auto-deploy, add RENDER_DEPLOY_HOOK_URL to repository secrets."
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  # Job 6: Post-deployment health check
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 60
      
      - name: Check health endpoint
        if: env.APP_URL != ''
        run: |
          echo "Checking health endpoint: ${{ secrets.APP_URL }}/healthz"
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/healthz" || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed with status: $response"
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
      
      - name: Health check skipped
        if: env.APP_URL == ''
        run: |
          echo "APP_URL not configured. Skipping health check."
          echo "To enable health checks, add APP_URL to repository secrets."
        env:
          APP_URL: ${{ secrets.APP_URL }}

# Workflow summary
# This workflow:
# 1. Lints code with Flake8, Black, isort, and Prettier
# 2. Runs all tests with pytest and generates coverage report
# 3. Builds Docker image for production
# 4. Scans dependencies for security vulnerabilities
# 5. Deploys to Render on main branch push (if configured)
# 6. Runs post-deployment health check (if configured)
