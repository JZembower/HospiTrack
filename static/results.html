<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Emergency care search results - Find the best hospital for your needs">
  <title>Search Results - HospiTrack</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-brand">🏥 HospiTrack</a>
      <button class="navbar-toggle" aria-label="Toggle navigation">☰</button>
      <ul class="navbar-menu">
        <li><a href="home.html">Find Care</a></li>
        <li><a href="explore.html">Explore</a></li>
        <li><a href="demo.html">Demo</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <!-- Back Button -->
    <div class="mb-2">
      <a href="home.html" class="btn btn-outline">← Back to Search</a>
      <a href="explore.html" class="btn btn-outline">🗺️ Explore All Hospitals</a>
    </div>

    <!-- Ranking Explanation -->
    <div id="rankingExplanation" class="alert alert-info" style="display: none;">
      <strong>📊 How We Ranked These Hospitals:</strong>
      <p id="explanationText" style="margin-top: 0.5rem;"></p>
    </div>

    <!-- Editable Filters Panel -->
    <div class="filter-panel" id="filterPanel">
      <div class="filter-header">
        <h3 style="margin: 0;">Refine Your Search</h3>
        <button class="filter-toggle" id="filterToggle" aria-label="Toggle filters">▼</button>
      </div>
      <div id="filterContent">
        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label">Sort By</label>
            <select id="sortBy" class="form-select">
              <option value="time">Fastest Care (Wait Time)</option>
              <option value="quality">Highest Quality</option>
              <option value="rating">Best Patient Rating</option>
              <option value="mortality">Lowest Mortality</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label">Search Radius: <span id="radiusValue">25 km</span></label>
            <input type="range" id="radiusSlider" class="form-range" min="5" max="100" value="25" step="5">
          </div>
          
          <div class="form-group">
            <label class="form-label">Filter by State</label>
            <select id="stateFilter" class="form-select">
              <option value="">All States</option>
            </select>
          </div>
          
          <div class="form-group" style="display: flex; align-items: flex-end;">
            <button id="updateResultsBtn" class="btn btn-primary btn-block">🔄 Update Results</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Results Count -->
    <div id="resultsCount" class="mb-2" style="font-size: 1.1rem; font-weight: 600;"></div>

    <!-- Split Layout: Map + Hospital List -->
    <div class="split-layout">
      <!-- Map (Left) -->
      <div class="split-left">
        <div class="map-container">
          <div id="map"></div>
        </div>
      </div>
      
      <!-- Hospital List (Right) -->
      <div class="split-right">
        <div class="hospital-list" id="hospitalList">
          <!-- Hospital cards will be inserted here -->
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="pagination" style="display: none;">
      <!-- Pagination buttons will be inserted here -->
    </div>
  </div>

  <!-- JavaScript -->
  <script src="js/utils.js"></script>
  <script src="js/map.js"></script>
  <script>
    let currentResults = null;
    let currentParams = null;
    const RESULTS_PER_PAGE = 50;
    let currentPage = 1;

    // Initialize page
    document.addEventListener('DOMContentLoaded', async () => {
      // Load states
      await populateStateDropdown('stateFilter', true);
      
      // Get URL params and stored results
      currentParams = getUrlParams();
      
      // Try to get results from sessionStorage first
      const storedResults = sessionStorage.getItem('searchResults');
      if (storedResults) {
        currentResults = JSON.parse(storedResults);
        sessionStorage.removeItem('searchResults'); // Clear after use
        displayResults(currentResults);
      } else if (Object.keys(currentParams).length > 0) {
        // If no stored results, fetch based on URL params
        await fetchResults();
      } else {
        // No params or results, redirect to home
        window.location.href = 'home.html';
        return;
      }
      
      // Setup event listeners
      setupEventListeners();
    });

    // Setup Event Listeners
    function setupEventListeners() {
      // Filter toggle
      document.getElementById('filterToggle').addEventListener('click', toggleFilters);
      
      // Radius slider
      document.getElementById('radiusSlider').addEventListener('input', (e) => {
        document.getElementById('radiusValue').textContent = `${e.target.value} km`;
      });
      
      // Update results button
      document.getElementById('updateResultsBtn').addEventListener('click', handleUpdateResults);
      
      // Populate filter values from URL params
      if (currentParams.priority) {
        document.getElementById('sortBy').value = currentParams.priority;
      }
      if (currentParams.radius_km) {
        const slider = document.getElementById('radiusSlider');
        slider.value = currentParams.radius_km;
        document.getElementById('radiusValue').textContent = `${currentParams.radius_km} km`;
      }
      if (currentParams.state) {
        document.getElementById('stateFilter').value = currentParams.state;
      }
    }

    // Toggle Filters
    function toggleFilters() {
      const content = document.getElementById('filterContent');
      const toggle = document.getElementById('filterToggle');
      const panel = document.getElementById('filterPanel');
      
      if (content.style.display === 'none') {
        content.style.display = 'block';
        toggle.textContent = '▼';
        panel.classList.remove('collapsed');
      } else {
        content.style.display = 'none';
        toggle.textContent = '▶';
        panel.classList.add('collapsed');
      }
    }

    // Fetch Results from API
    async function fetchResults() {
      showLoading('Searching for hospitals...');
      
      try {
        const searchData = {
          complaint: currentParams.complaint,
          priority: currentParams.priority || document.getElementById('sortBy').value,
          radius_km: parseInt(currentParams.radius_km || document.getElementById('radiusSlider').value)
        };
        
        // Add location
        if (currentParams.address) {
          searchData.location = currentParams.address;
        } else if (currentParams.lat && currentParams.lon) {
          searchData.lat = parseFloat(currentParams.lat);
          searchData.lon = parseFloat(currentParams.lon);
        }
        
        // Add optional state filter
        if (currentParams.state) {
          searchData.state_filter = currentParams.state;
        }
        
        currentResults = await apiPost('/api/search', searchData);
        hideLoading();
        displayResults(currentResults);
        
      } catch (error) {
        hideLoading();
        showError(`Failed to fetch results: ${error.message}`);
      }
    }

    // Handle Update Results
    async function handleUpdateResults() {
      // Update params
      currentParams.priority = document.getElementById('sortBy').value;
      currentParams.radius_km = document.getElementById('radiusSlider').value;
      currentParams.state = document.getElementById('stateFilter').value;
      
      // Update URL
      setUrlParams(currentParams);
      
      // Fetch new results
      await fetchResults();
    }

    // Display Results
    function displayResults(results) {
      if (!results || !results.hospitals || results.hospitals.length === 0) {
        showNoResults();
        return;
      }
      
      // Display ranking explanation
      if (results.ranking_explanation) {
        document.getElementById('rankingExplanation').style.display = 'block';
        document.getElementById('explanationText').textContent = results.ranking_explanation;
      }
      
      // Display results count
      document.getElementById('resultsCount').textContent = 
        `Found ${results.hospitals.length} hospital${results.hospitals.length !== 1 ? 's' : ''}`;
      
      // Initialize map
      if (results.user_location) {
        const { lat, lon } = results.user_location;
        initMap('map', [lat, lon], 10);
        addUserMarker(lat, lon);
      } else {
        initMap('map');
      }
      
      // Add hospital markers
      addHospitalMarkers(results.hospitals);
      
      // Display hospital list
      displayHospitalList(results.hospitals);
      
      // Setup pagination if needed
      if (results.hospitals.length > RESULTS_PER_PAGE) {
        setupPagination(results.hospitals.length);
      }
    }

    // Display Hospital List
    function displayHospitalList(hospitals) {
      const listContainer = document.getElementById('hospitalList');
      listContainer.innerHTML = '';
      
      // Calculate pagination
      const startIdx = (currentPage - 1) * RESULTS_PER_PAGE;
      const endIdx = Math.min(startIdx + RESULTS_PER_PAGE, hospitals.length);
      const pageHospitals = hospitals.slice(startIdx, endIdx);
      
      pageHospitals.forEach((hospital, idx) => {
        const globalIdx = startIdx + idx;
        const card = createHospitalCard(hospital, globalIdx);
        listContainer.appendChild(card);
      });
    }

    // Create Hospital Card
    function createHospitalCard(hospital, index) {
      const card = document.createElement('div');
      card.className = 'hospital-card';
      card.dataset.index = index;
      
      // Hospital name
      const name = document.createElement('div');
      name.className = 'hospital-name';
      name.textContent = `${index + 1}. ${hospital.facility_name || 'Unknown Hospital'}`;
      card.appendChild(name);
      
      // Address
      if (hospital.address) {
        const address = document.createElement('div');
        address.className = 'hospital-address';
        address.textContent = hospital.address;
        card.appendChild(address);
      }
      
      // Metrics
      const metrics = document.createElement('div');
      metrics.className = 'hospital-metrics';
      
      // Distance
      if (hospital.distance_km !== undefined) {
        metrics.appendChild(createMetric('Distance', formatDistance(hospital.distance_km)));
      }
      
      // Wait Time
      if (hospital.ed_avg_time_admit !== undefined) {
        metrics.appendChild(createMetric('Wait Time', formatWaitTime(hospital.ed_avg_time_admit)));
      }
      
      // Rating
      if (hospital.overall_rating) {
        metrics.appendChild(createMetric('Rating', formatRating(hospital.overall_rating)));
      }
      
      // Quality Score
      if (hospital.quality_points !== undefined) {
        metrics.appendChild(createMetric('Quality', formatQualityScore(hospital.quality_points)));
      }
      
      // Mortality
      if (hospital.mortality_display) {
        metrics.appendChild(createMetric('Mortality', hospital.mortality_display));
      }
      
      card.appendChild(metrics);
      
      // Click handler
      card.addEventListener('click', () => {
        // Highlight this card
        document.querySelectorAll('.hospital-card').forEach(c => c.classList.remove('highlighted'));
        card.classList.add('highlighted');
        
        // Highlight marker on map
        highlightMarker(index);
      });
      
      return card;
    }

    // Create Metric Element
    function createMetric(label, value) {
      const metric = document.createElement('div');
      metric.className = 'metric';
      metric.innerHTML = `
        <span class="metric-label">${label}:</span> 
        <span class="metric-value">${value}</span>
      `;
      return metric;
    }

    // Show No Results
    function showNoResults() {
      document.getElementById('resultsCount').textContent = 'No hospitals found';
      document.getElementById('hospitalList').innerHTML = `
        <div style="padding: 2rem; text-align: center; color: var(--text-secondary);">
          <h3>No hospitals found</h3>
          <p>Try adjusting your search radius or removing the state filter.</p>
          <button onclick="window.location.href='home.html'" class="btn btn-primary mt-2">
            New Search
          </button>
        </div>
      `;
      initMap('map');
    }

    // Setup Pagination
    function setupPagination(totalResults) {
      const totalPages = Math.ceil(totalResults / RESULTS_PER_PAGE);
      if (totalPages <= 1) {
        document.getElementById('pagination').style.display = 'none';
        return;
      }
      
      const paginationContainer = document.getElementById('pagination');
      paginationContainer.style.display = 'flex';
      paginationContainer.innerHTML = '';
      
      // Previous button
      const prevBtn = document.createElement('button');
      prevBtn.textContent = '← Previous';
      prevBtn.disabled = currentPage === 1;
      prevBtn.addEventListener('click', () => changePage(currentPage - 1));
      paginationContainer.appendChild(prevBtn);
      
      // Page numbers
      const maxPages = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxPages / 2));
      let endPage = Math.min(totalPages, startPage + maxPages - 1);
      
      if (endPage - startPage < maxPages - 1) {
        startPage = Math.max(1, endPage - maxPages + 1);
      }
      
      for (let i = startPage; i <= endPage; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.textContent = i;
        pageBtn.className = i === currentPage ? 'active' : '';
        pageBtn.addEventListener('click', () => changePage(i));
        paginationContainer.appendChild(pageBtn);
      }
      
      // Next button
      const nextBtn = document.createElement('button');
      nextBtn.textContent = 'Next →';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.addEventListener('click', () => changePage(currentPage + 1));
      paginationContainer.appendChild(nextBtn);
    }

    // Change Page
    function changePage(page) {
      currentPage = page;
      displayHospitalList(currentResults.hospitals);
      setupPagination(currentResults.hospitals.length);
      
      // Scroll to top of results
      document.querySelector('.split-layout').scrollIntoView({ behavior: 'smooth' });
    }

    // Override viewHospitalDetails for this page
    window.viewHospitalDetails = function(facilityId) {
      const hospital = currentResults.hospitals.find(h => h.facility_id === facilityId);
      if (hospital) {
        const idx = currentResults.hospitals.indexOf(hospital);
        highlightMarker(idx);
        
        // Scroll to hospital card
        const card = document.querySelector(`.hospital-card[data-index="${idx}"]`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.add('highlighted');
        }
      }
    };
  </script>
</body>
</html>
